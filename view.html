<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="main p-5 mx-2 my-3">
        <div id="output" class="row">
        
        </div>
     
      
    </div>
</body>


<script>
    let param = new URLSearchParams(window.location.search)
     console.log(param);
   
    const data = param.get('id')
    console.log(data);
     fetch(`https://dummyjson.com/recipes/${data}`).then(res =>
      res.json()).then(result => 
      {

            console.log(result);

            let display = document.getElementById('output')

            display.innerHTML = `
                <div class="col-6">
                    <img src="${result.image}" class="img-fluid" alt="${result.name}">
                </div>

                <div class="col-6">
                    <h3>${result.name}</h3>

                    <p><b>Cuisine:</b> ${result.cuisine}</p>
                    <p><b>Difficulty:</b> ${result.difficulty}</p>
                    <p><b>Rating:</b> ${result.rating}</p>
                    <p><b>Calories:</b> ${result.caloriesPerServing}</p>
                </div>
        <table class="table">
        <thead>
            <tr>
                <th>Ingredients</th>
            </tr>
        </thead>
        <tbody>
            ${result.ingredients.map(i => `
                <tr>
                    <td>${i}</td>
                </tr>
            `)}
        </tbody>
        </table>
       <div class="row">
        <h4 class=text-center>instructions</h4>
         <table class="table">
        <tbody>
            ${result.instructions.map(i => `
                <tr>
                    <td>${i}</td>
                </tr>
            `)}
        </tbody>
     </table>
      </div> 
            `
        })
 

</script>
</html>
