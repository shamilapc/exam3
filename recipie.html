<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
 
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder">Recipies</h1>
                <p class="lead fw-normal text-white-50 mb-0"></p>
            </div>
        </div>
    </header>
    <section class="py-5">
        <div class="container px-4 px-lg-5 mt-5">
            <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center" id="recipie">
            
            </div>
        </div>
    </section>
   
</body>
<script>
let display = document.getElementById('recipie')
const view=(id)=> {
    window.location = `view.html?id=${id}`
}

fetch('https://dummyjson.com/recipes').then(res=>
res.json().then(result=>{
     console.log(result)
     let data = result.recipes
     data.forEach(rec=>{
       display.innerHTML += `
         <div class="col mb-5" >
         <div class="card h-100">
                           
                            <img class="card-img-top" src='${rec.image}' height="150px" alt="..." />
                           
                            <div class="card-body p-4">
                                <div >
                                   
                                    <h5 class="fw-bolder">${rec.name}</h5>
                                    <span><small></small>${rec.difficulty}</span>
                                   
                                </div>
                            </div>
                           
                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            
                                 <button class="btn btn-dark text-light w-100" onclick="view(${rec.id})">view</button>
                            </div>
                        </div>
                        </div>

       `
     })



}
   
   
))




 
</script>
</html>
